name: Daily brief update

on:
  schedule:
    - cron: "0 22 * * *"      # 22:00 UTC = 06:00 in Manila
  workflow_dispatch:           # also lets you press "Run workflow" by hand

permissions:
  contents: write              # lets the job save live.js back to the repo

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read feeds and write live.js
        run: python fetch.py
      - name: Save changes
        run: |
          git config user.name "tp-brief-bot"
          git config user.email "tp-brief-bot@users.noreply.github.com"
          git add live.js history.json
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Daily update"
            git push
          fi
